# For a project whose characteristic failure is a silent numerical error, no CI
# is not acceptable. Three jobs, in the order they are cheap to fail:
#
#   test   the consistency checks, including the finite-difference guard that
#          would have caught the missing therapeutic increment
#   audit  the claim register: non-zero while any claim is contradicted or any
#          identifier fails to resolve
#   paper  the document builds and every reference resolves
#   artefacts  every figure and table regenerated and compared with the
#          committed copy, which is the check the design table needed
#
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install numpy scipy matplotlib pytest sympy
      - name: make test
        run: make test PY=python

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install numpy scipy matplotlib sympy requests
      - name: make audit
        run: make audit PY=python

  # Every figure and table, regenerated from the code and compared with what
  # is committed. `make paper` deliberately does NOT depend on `make figures`:
  # the decision characteristic is simulated and the target costs minutes, so
  # making every local paper build pay that is how a slow check gets bypassed.
  # It belongs here instead, once per push. Without it nothing compared the
  # committed artefacts with their generators, and the design table drifted
  # for a month (REVIEW_LOG.md R23).
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: pip install numpy scipy matplotlib sympy
      - name: regenerate every figure and table
        run: make figures PY=python
      # matplotlib stamps the wall clock into every PDF, so the whole tree
      # reports as changed on every run. The check strips /CreationDate and
      # /ModDate before comparing. Tables and the numbers file fail on any
      # remaining difference; figures do not, because a runner's matplotlib
      # is not the author's and two versions do not render byte-identically
      # from identical data. A missing or empty figure still fails.
      - name: compare against what is committed
        run: python tools/check_artefacts.py --working-tree
      - name: show what drifted
        if: failure()
        run: |
          echo "::group::git status"
          git status --porcelain results
          echo "::endgroup::"
          echo "::group::table diffs"
          git diff -- results/tables | head -200
          echo "::endgroup::"

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install python
        run: pip install numpy scipy matplotlib sympy requests
      - name: install latex
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-base texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures lmodern \
            texlive-bibtex-extra biber
      # biblatex lives in texlive-bibtex-extra and tikz in texlive-pictures;
      # neither is pulled in by texlive-latex-extra, and leaving them out fails
      # pdflatex in the first half second with the error hidden by the
      # Makefile's own redirect.
      - name: make paper
        run: make paper PY=python
      - name: show the LaTeX log if the build failed
        if: failure()
        run: |
          echo "::group::last 120 lines of paper/main.log"
          tail -120 paper/main.log 2>/dev/null || echo "no main.log was produced"
          echo "::endgroup::"
          echo "::group::last 120 lines of paper/supplement.log"
          tail -120 paper/supplement.log 2>/dev/null || echo "no supplement.log was produced"
          echo "::endgroup::"
          echo "::group::LaTeX errors"
          grep -n -A4 "^!" paper/main.log 2>/dev/null | head -60 || true
          echo "::endgroup::"
      - name: no undefined references
        run: |
          if grep -q "undefined" paper/main.log; then
            echo "::error::undefined references or citations in paper/main.log"
            grep -n "undefined" paper/main.log | head -40
            exit 1
          fi
          if grep -q "multiply defined" paper/main.log; then
            echo "::error::multiply defined labels in paper/main.log"
            grep -n "multiply defined" paper/main.log | head -40
            exit 1
          fi
      # The artifact is a convenience, not a result. An account-level storage
      # quota is not a defect in this branch and must not fail a green build.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: paper
          path: |
            paper/main.pdf
            paper/main.log
