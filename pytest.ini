# ===================================================================
#  Warnings are errors.
#
#  WHY. A single warning appeared in one run of the suite and did not
#  reproduce on the next. With no CI to give repeated runs, an intermittent
#  warning is a bug that arrives as a memory: a count in a summary line, no
#  text, no traceback, and nothing to diagnose it from the second time
#  either. Turning warnings into errors converts that class from something
#  noticed into something caught, with its full traceback attached, the
#  first time it happens.
#
#  It is affordable: the suite passes under `-W error` today, so this costs
#  nothing now and only ever fires on something new.
#
#  It matters more here than in most repositories. This project's stated
#  characteristic failure is a silent numerical error, and numpy's way of
#  reporting exactly that -- an invalid value in a divide, an overflow in an
#  exp, an all-NaN slice -- is a RuntimeWarning. Those are the warnings this
#  setting is for; the deprecation notices are a bonus.
#
#  It also reaches the generators. tests/test_artefacts.py regenerates every
#  table and numbers file through tools/check_artefacts.py, so the code that
#  produces the paper's numbers runs under this setting too, not just the
#  test bodies.
#
#  If an upstream release later emits a DeprecationWarning through no fault
#  of this repository, the right response is to add a single targeted
#  `ignore::` line naming it -- not to relax the default. A tolerated warning
#  should be a decision with a name on it.
# ===================================================================
[pytest]
filterwarnings = error
